{{- include "portainer-run.validateStorageClass" . -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "portainer-run.cacheClaimName" . }}
  labels:
    {{- include "portainer-run.labels" . | nindent 4 }}
spec:
  {{- with .Values.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
