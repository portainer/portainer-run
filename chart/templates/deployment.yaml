apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portainer-run.fullname" . }}
  labels:
    {{- include "portainer-run.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Prevents slow installs when something is failing
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      {{- include "portainer-run.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pod when the ConfigMap changes. No equivalent for the
        # Secret: it is not part of this chart (see envFrom), so whoever writes
        # it must restart the Deployment themselves.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "portainer-run.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The ServiceAccount token stays mounted: the server auto-detects
      # CONFIG_NAMESPACE from it. If it is ever disabled, pin CONFIG_NAMESPACE
      # in the ConfigMap at the same time or state silently moves to kube-system.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portainer-run
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: {{ include "portainer-run.port" . }}
              protocol: TCP
          # Loaded wholesale, not key by key: the chart does not know which
          # settings exist and must not change when one is added.
          #
          # The Secret is deliberately external — routing secrets through Helm
          # values persists them in cleartext in every release revision. Fixed
          # name so its writer can find it. `optional` is load-bearing: on a
          # fresh install it does not exist yet, and without it the pod would
          # fail to start rather than boot into "awaiting setup".
          envFrom:
            - configMapRef:
                name: portainer-run-config
            - secretRef:
                name: portainer-run-secret
                optional: true
          volumeMounts:
            - name: cache
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          {{- /* Probes follow the baked-in PORT (see _helpers.tpl). Always plain HTTP. */}}
          {{- $probePort := include "portainer-run.port" . }}
          livenessProbe:
            httpGet:
              path: /config
              port: {{ $probePort }}
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /config
              port: {{ $probePort }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "portainer-run.cacheClaimName" . }}
