apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portainer-run.fullname" . }}
  labels:
    {{- include "portainer-run.labels" . | nindent 4 }}
spec:
  replicas: 1
  # maxSurge 0 because the cache PVC is ReadWriteOnce: a second pod on another
  # node cannot mount it. Not Recreate — the API server defaults rollingUpdate
  # into existing installs, Helm's three-way merge keeps it, and Recreate
  # rejects the pair.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # Prevents slow installs when something is failing
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      {{- include "portainer-run.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "portainer-run.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The ServiceAccount token stays mounted: the server auto-detects
      # CONFIG_NAMESPACE from it. If it is ever disabled, pin CONFIG_NAMESPACE
      # in the ConfigMap at the same time or state silently moves to kube-system.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portainer-run
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: {{ include "portainer-run.port" . }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: portainer-run-config
            - secretRef:
                name: portainer-run-secret
                optional: true
          volumeMounts:
            - name: cache
              mountPath: /app/data
            {{- /*
              Mounted rather than envFrom because the kubelet refreshes a mounted
              Secret in place, which is what lets a repaired credential reach a
              running pod without a restart.
            */}}
            - name: portainer-credential
              mountPath: {{ include "portainer-run.credentialDir" . | quote }}
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          {{- /* Probes follow the baked-in PORT (see _helpers.tpl). Always plain HTTP. */}}
          {{- $probePort := include "portainer-run.port" . }}
          livenessProbe:
            httpGet:
              path: /config
              port: {{ $probePort }}
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /config
              port: {{ $probePort }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "portainer-run.cacheClaimName" . }}
        - name: portainer-credential
          secret:
            # Fixed name: Portainer derives it from the add-on id in its catalog
            # and creates the Secret itself, so this cannot be templated off the
            # release name without breaking the mount.
            secretName: portainer-run-token
            # Absent where Portainer has not issued a credential; the server
            # borrows an admin caller's token instead.
            optional: true
            # Readable only by the container's own user. Root today, so this is
            # readable as written; a non-root user would need a matching fsGroup.
            defaultMode: 0400
