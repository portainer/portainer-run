apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portainer-run.fullname" . }}
  labels:
    {{- include "portainer-run.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "portainer-run.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when config/secret change so new values take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "portainer-run.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The ServiceAccount token stays mounted: the server auto-detects
      # CONFIG_NAMESPACE from it. If it is ever disabled, pin CONFIG_NAMESPACE
      # in the ConfigMap at the same time or state silently moves to kube-system.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portainer-run
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          # Note: no runAsNonRoot / drop-ALL-caps / readOnlyRootFilesystem — the
          # server binds a privileged port (80/443, needs CAP_NET_BIND_SERVICE)
          # and writes a self-signed cert to /app in TLS mode.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: portainer-run-config
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "portainer-run.fullname" . }}-secret
                  key: ENCRYPTION_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "portainer-run.fullname" . }}-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "portainer-run.fullname" . }}-secret
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: cache
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          {{- /* Probes follow the baked-in PORT and serve mode (see _helpers.tpl): */}}
          {{- /* SERVE_HTTP=1 → plain HTTP, otherwise HTTPS. */}}
          {{- $probePort := include "portainer-run.port" . }}
          {{- $probeScheme := ternary "HTTP" "HTTPS" (eq (include "portainer-run.serveHttp" .) "1") }}
          livenessProbe:
            httpGet:
              path: /config
              port: {{ $probePort }}
              scheme: {{ $probeScheme }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /config
              port: {{ $probePort }}
              scheme: {{ $probeScheme }}
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "portainer-run.fullname" . }}-cache
