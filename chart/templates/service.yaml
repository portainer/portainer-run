apiVersion: v1
kind: Service
metadata:
  name: {{ include "portainer-run.fullname" . }}
  labels:
    {{- include "portainer-run.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "portainer-run.selectorLabels" . | nindent 4 }}
  ports:
    # Service port stays 80 so the addon gateway's target is unchanged; the
    # container itself listens on the unprivileged containerPort behind it.
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
