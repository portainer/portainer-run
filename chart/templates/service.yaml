apiVersion: v1
kind: Service
metadata:
  name: {{ include "portainer-run.fullname" . }}
  labels:
    {{- include "portainer-run.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "portainer-run.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
