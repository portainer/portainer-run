name: release
run-name: '${{ github.event.inputs.version }} pre-release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'portainer-run version. e.g. 0.x.x, 0.x.x-beta or v0.x.x'
        required: true

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: portainer
  IMAGE_NAME: portainer-run

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: '[preparation] checkout the current branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '[validation] check server syntax'
        run: node --check server/server.js

  validate-chart:
    name: validate-chart
    runs-on: ubuntu-latest
    steps:
      - name: '[preparation] checkout the current branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '[preparation] set up helm'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: '[validation] lint chart'
        run: helm lint chart/

      - name: '[validation] template chart (dry-run render)'
        run: helm template portainer-run chart/ > /dev/null

  create-release:
    name: create-release
    runs-on: ubuntu-latest
    needs: [validate, validate-chart]
    outputs:
      version: ${{ steps.normalize.outputs.value }}
    steps:
      - name: '[preparation] normalize version'
        id: normalize
        run: |
          version="${{ github.event.inputs.version }}"
          echo "value=${version#v}" >> "$GITHUB_OUTPUT"

      - name: '[execution] create a pre-release'
        run: |
          gh release create \
            "${{ github.event.inputs.version }}" \
            --repo portainer/portainer-run \
            --title "${{ github.event.inputs.version }}" \
            --target develop \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    name: publish-images
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      # Exchange the org's GitHub App credentials for a short-lived, narrowly
      # scoped installation token so checkout can pull the private design-system
      # submodule (the default GITHUB_TOKEN can't see a separate repo).
      - name: '[preparation] fetch GitHub App token'
        id: fetch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PORTAINER_BOT_ID }}
          private-key: ${{ secrets.PORTAINER_BOT_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: portainer-run,design-system
          permission-contents: read

      - name: '[preparation] checkout the current branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.fetch-token.outputs.token }}

      - name: '[preparation] capture git commit'
        id: git-info
        run: echo "sha=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"

      - name: '[preparation] generate build date'
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: '[preparation] set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: '[preparation] set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: '[preparation] log in to registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: '[execution] build and push multi-arch image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Use the local checkout (with the submodule already fetched) as the
          # build context, so BuildKit doesn't re-clone the repo over SSH.
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PORTAINER_RUN_VERSION=${{ needs.create-release.outputs.version }}
            GIT_COMMIT=${{ steps.git-info.outputs.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.version }}
          sbom: true
          provenance: mode=max
