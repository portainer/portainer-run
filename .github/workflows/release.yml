# GA add-on — must be dispatched from a release/X.Y branch (the shared
# enforce-release-branch default is true; this repo doesn't opt out, unlike
# the beta add-ons). See portal-template/portainer-command for the same
# pattern applied at the other tier.
#
# resolve-image-tag strips a leading "v" and normalizes the version, so
# every job below reads the clean value straight from build-app-image's tag
# output — no separate normalize job needed for the image tag itself.
#
# The one exception is normalize-version below: PORTAINER_RUN_VERSION gets
# baked into the frontend bundle (Dockerfile ARG PORTAINER_RUN_VERSION,
# footer) as a build-arg INPUT to build-app-image, which runs before that
# same call's own resolve-image-tag step has produced its cleaned value —
# so it can't be sourced from build-app-image's own output the way the
# image tag is. Same shape as portainer-command's APP_VERSION. CI/dev
# builds never set this build-arg at all (see ci.yml) — a real, visible
# change from before, when ci.yml did stamp the pr-<n>/branch tag in; those
# builds now fall back to the app's own 'dev' default instead. Confirmed
# cosmetic-only (a footer string), never load-bearing. A follow-up would be
# needed to align with how other add-ons pick up their version string, if
# that's wanted here too.
#
# pre-release defaults true (the safe, non-consequential path) — set it
# false for a real release.

name: release
run-name: "${{ inputs.pre-release && 'Pre-release' || 'Release' }} ${{ github.event.repository.name }}:${{ github.event.inputs.version }}"

concurrency:
  group: release-publish-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
      pre-release:
        type: boolean
        default: true
        description: 'Pre-release (portainerci/dev-charts)'

permissions:
  contents: read

jobs:
  normalize-version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.strip.outputs.value }}
    steps:
      - id: strip
        run: echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

  validate:
    uses: portainer/github-actions/.github/workflows/validate.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      runtime: node
      package-manager: pnpm
      app-repositories: portainer-run,design-system
    secrets:
      app-id: ${{ secrets.PORTAINER_BOT_ID }}
      app-private-key: ${{ secrets.PORTAINER_BOT_KEY }}

  build-app-image:
    needs: [validate, normalize-version]
    uses: portainer/github-actions/.github/workflows/build-image.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      image-name: portainer-run
      registry-namespace: ${{ inputs.pre-release && 'portainerci' || 'portainer' }}
      image-tag: ${{ github.event.inputs.version }}
      app-repositories: portainer-run,design-system
      build-args: |
        PORTAINER_RUN_VERSION=${{ needs.normalize-version.outputs.value }}
    secrets:
      app-id: ${{ secrets.PORTAINER_BOT_ID }}
      app-private-key: ${{ secrets.PORTAINER_BOT_KEY }}
      registry-username: ${{ secrets.DOCKER_HUB_USERNAME }}
      registry-password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  scout-app-image:
    needs: [build-app-image]
    permissions:
      contents: read
      pull-requests: write
    uses: portainer/github-actions/.github/workflows/scout.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      image: ${{ needs.build-app-image.outputs.image-ref }}
      # Non-blocking on every path here, including pre-release — see ci.yml.
      non-blocking: true
    secrets:
      registry-username: ${{ secrets.DOCKER_HUB_USERNAME }}
      registry-password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  # needs both build and scout (chart publishes after scanning, not
  # alongside). build-app-image stays listed even though scout already
  # depends on it — outputs are only readable from a job you directly need.
  publish-chart:
    needs: [build-app-image, scout-app-image]
    permissions:
      contents: read
      packages: write
    uses: portainer/github-actions/.github/workflows/publish-chart.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      image-tag: ${{ needs.build-app-image.outputs.tag }}
      chart-oci-registry: ${{ inputs.pre-release && 'oci://ghcr.io/portainer/dev-charts' || 'oci://ghcr.io/portainer/charts' }}

  # Real release only. Only caller job that grants contents: write — keeps
  # ci/pre-release from needing a permission they never use.
  publish-release:
    needs: [build-app-image, publish-chart, scout-app-image]
    if: '!inputs.pre-release'
    permissions:
      contents: write
    uses: portainer/github-actions/.github/workflows/publish-github-release.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      version: ${{ needs.build-app-image.outputs.tag }}
      image-refs: |
        ${{ needs.build-app-image.outputs.image-ref }}
    secrets:
      registry-username: ${{ secrets.DOCKER_HUB_USERNAME }}
      registry-password: ${{ secrets.DOCKER_HUB_PASSWORD }}
