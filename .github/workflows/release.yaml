name: release
run-name: '${{ github.event.inputs.version }} release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'portainer-run version. e.g. 0.x.x, 0.x.x-beta or v0.x.x'
        required: true

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: portainer
  IMAGE_NAME: portainer-run

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: '[preparation] checkout the current branch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: '[validation] check server syntax'
        run: node --check server/server.js

  release:
    name: create a pre-release
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: '[execution] create a pre-release'
        run: |
          gh release create \
            "${{ github.event.inputs.version }}" \
            --repo portainer/portainer-run \
            --title "${{ github.event.inputs.version }}" \
            --target develop \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build and push docker image
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      # Exchange the org's GitHub App credentials for a short-lived, narrowly
      # scoped installation token so checkout can pull the private design-system
      # submodule (the default GITHUB_TOKEN can't see a separate repo).
      - name: '[preparation] fetch GitHub App token'
        id: fetch-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.PORTAINER_BOT_ID }}
          private-key: ${{ secrets.PORTAINER_BOT_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: portainer-run,design-system
          permission-contents: read

      - name: '[preparation] checkout the current branch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          token: ${{ steps.fetch-token.outputs.token }}

      - name: '[preparation] set up QEMU'
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: '[preparation] set up Docker Buildx'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: '[preparation] log in to registry'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: '[execution] build and push multi-arch image'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          # Use the local checkout (with the submodule already fetched) as the
          # build context, so BuildKit doesn't re-clone the repo over SSH.
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PORTAINER_RUN_VERSION=${{ github.event.inputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sbom: true
          provenance: mode=max

  publish-chart:
    name: publish helm chart
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: '[preparation] checkout the current branch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: '[preparation] set up Helm'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: '[validation] lint chart'
        run: helm lint chart/

      - name: '[validation] template chart (dry-run render)'
        run: helm template portainer-run chart/ > /dev/null

      - name: '[execution] package chart'
        run: |
          helm package chart/ \
            --version "${{ github.event.inputs.version }}" \
            --app-version "${{ github.event.inputs.version }}" \
            -d /tmp/chart-dist

      - name: '[execution] log in to GHCR'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: '[execution] push chart'
        run: helm push /tmp/chart-dist/portainer-run-*.tgz oci://ghcr.io/portainer/charts
