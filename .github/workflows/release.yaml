name: release
run-name: "${{ github.event.inputs.version }} release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "portainer-run version. e.g. 0.x.x, 0.x.x-beta or v0.x.x"
        required: true

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: portainer
  IMAGE_NAME: portainer-run

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "[validation] check server syntax"
        run: node --check server/server.js

  release:
    name: create a pre-release
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: "[execution] create a pre-release"
        run: |
          gh release create \
            "${{ github.event.inputs.version }}" \
            --repo portainer/portainer-run \
            --title "${{ github.event.inputs.version }}" \
            --target develop \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build and push docker image
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "[preparation] set up QEMU"
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: "[preparation] set up Docker Buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: "[preparation] log in to registry"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "[execution] build and push multi-arch image"
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sbom: true
          provenance: mode=max
