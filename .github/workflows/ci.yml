# Consumes portainer/github-actions@v1.0.0's shared workflows. Single image
# here — job ids keep the -app-image suffix so a second image would just be
# another build-*-image/scout-*-image pair (see portainer-command).
#
# Renamed from ci.yaml to ci.yml as part of this migration, matching every
# other add-on repo's convention.
#
# Drops the previous fork-safe two-stage design (build without secrets on a
# PR, publish separately via ci-publish.yaml's workflow_run trigger). This
# repo is genuinely public, unlike its siblings, but takes no external PRs in
# practice (confirmed: every recent PR came from within the org) — the extra
# complexity bought no real protection. build-image.yml builds and pushes
# directly in one job, same as every other migrated repo.

name: ci

on:
  pull_request:
    branches: [develop, 'release/**']
  push:
    branches: [develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: portainer/github-actions/.github/workflows/validate.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      runtime: node
      package-manager: pnpm
      app-repositories: portainer-run,design-system
      # NOT enforce-no-secrets-guard: this chart legitimately renders a
      # Secret (a generated ENCRYPTION_KEY carried across helm upgrade) —
      # the exact exception chart-render-guard's own description names
      # this repo for, confirmed by actually rendering the chart before
      # deciding.
    secrets:
      app-id: ${{ secrets.PORTAINER_BOT_ID }}
      app-private-key: ${{ secrets.PORTAINER_BOT_KEY }}

  build-app-image:
    needs: [validate]
    uses: portainer/github-actions/.github/workflows/build-image.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      image-name: portainer-run
      app-repositories: portainer-run,design-system
    secrets:
      app-id: ${{ secrets.PORTAINER_BOT_ID }}
      app-private-key: ${{ secrets.PORTAINER_BOT_KEY }}
      registry-username: ${{ secrets.DOCKER_HUB_USERNAME }}
      registry-password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  scout-app-image:
    needs: [build-app-image]
    # A job's own permissions: replaces the workflow-level default, not adds
    # to it — contents: read must be explicit here or scout.yml gets none.
    permissions:
      contents: read
      pull-requests: write
    uses: portainer/github-actions/.github/workflows/scout.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
    with:
      image: ${{ needs.build-app-image.outputs.image-ref }}
      # Deliberate choice for this migration, despite this repo being GA:
      # Scout didn't scan anything at all before this migration, so
      # non-blocking is the safer default to land with — revisit tightening
      # to blocking once there's a track record of clean scans.
      non-blocking: true
    secrets:
      registry-username: ${{ secrets.DOCKER_HUB_USERNAME }}
      registry-password: ${{ secrets.DOCKER_HUB_PASSWORD }}

  # Needs both build and scout, so the chart publishes after scanning, not
  # alongside it. Only publishes on a push event — PRs never publish one.
  publish-chart:
    needs: [build-app-image, scout-app-image]
    permissions:
      contents: read
      packages: write
    uses: portainer/github-actions/.github/workflows/publish-chart.yml@fb36fbd33331b28f8f7b565e7d58d8c23e34859c # v1.0.0
