# Portainer-Run — Docker Compose deployment
#
# Required: set PORTAINER_URL and ENCRYPTION_KEY before starting.
# Optional components are commented out with instructions below.
#
# Quick start:
#   docker compose up -d
#
# With environment file:
#   cp .env.example .env && docker compose --env-file .env up -d

services:
  portainer-run:
    image: portainer/portainer-run:latest
    # Alternatively, build from source:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: portainer-run
    restart: unless-stopped
    ports:
      - "443:443"   # HTTPS
      - "80:80"     # HTTP → HTTPS redirect
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      - PORTAINER_URL=https://portainer.example.com:9443
      # Encrypts stored Git target credentials. Min 32 chars. Generate: openssl rand -hex 32
      - ENCRYPTION_KEY=change-me-to-a-rand-32-string

      # ── AI provider (choose one) ───────────────────────────────────────────
      # Anthropic (Claude):
      - ANTHROPIC_API_KEY=
      # OpenAI (GPT-4o):
      # - OPENAI_API_KEY=
      # OpenAI model override (default: gpt-4o):
      # - OPENAI_MODEL=gpt-4o
      # Explicit provider override (auto-detected from key if not set):
      # - AI_PROVIDER=anthropic

      # ── Ingress base domain ───────────────────────────────────────────────
      # If set, Ingress templates default to appname.BASE_DOMAIN as the host.
      # - BASE_DOMAIN=apps.example.com

      # ── File relay gateway ────────────────────────────────────────────────
      # Required for staged file uploads via the run-gateway proxy.
      # When set, large vibe deploy uploads use the gateway instead of inline MCP transfer.
      - GATEWAY_URL=https://run-gateway.portainer.ai

      # ── Custom ports ──────────────────────────────────────────────────────
      # Change if 443/80 conflict with other services on the host.
      # - PORT=443
      # - HTTP_PORT=80

      # ── Cache directory ───────────────────────────────────────────────────
      # Override the directory used for persistent cache (default: /app/data).
      # Must match the mountPath of the volume below if changed.
      # - CACHE_DIR=/app/data

      # ── TLS certificates ──────────────────────────────────────────────────
      # Mount your cert directory (see volumes below) and set these paths.
      # Without these, a self-signed certificate is generated on first start.
      # - SSL_CERT=/certs/fullchain.pem
      # - SSL_KEY=/certs/privkey.pem
      # - SSL_CERT_DIR=/certs

    volumes:
      # ── Persistent session cache ──────────────────────────────────────────
      # Without this, the cache is lost on container restart.
      # Uncomment and ensure the host path exists before starting.
       - portainer-run-data:/app/data

      # ── Real TLS certificates ─────────────────────────────────────────────
      # Mount your cert directory and set SSL_CERT / SSL_KEY above.
      # Without this, a self-signed certificate is generated on first start.
      # - /etc/letsencrypt/live/portainer-run.example.com:/certs:ro

    # ── DNS ────────────────────────────────────────────────────────────────
    # If the container cannot resolve your Portainer hostname, uncomment:
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1

    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  portainer-run-data:
